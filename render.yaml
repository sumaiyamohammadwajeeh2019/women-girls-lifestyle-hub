services:
    - type: web
    name: digital-film-making-studio
    env: static
    buildCommand: ""
    staticPublishPath: ./
    routes:
            - type: rewrite
        source: /*
        destination: /index.html
    headers:
            - path: /sw.js
        name: Service-Worker-Allowed
        value: /
            - path: /*
        name: Cache-Control
        value: no-cache