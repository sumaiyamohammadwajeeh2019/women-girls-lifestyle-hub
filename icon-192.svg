<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2d55"/>
      <stop offset="50%" stop-color="#6a1b4d"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="96" cy="96" r="96" fill="url(#bg)"/>
  <circle cx="96" cy="96" r="90" fill="none" stroke="#d4af37" stroke-width="2"/>
  <circle cx="96" cy="96" r="86" fill="none" stroke="#d4af37" stroke-width="0.5" opacity="0.6"/>

  <!-- Crown -->
  <g fill="url(#gold)" stroke="#8a6d00" stroke-width="0.5">
    <path d="M70 48 L76 32 L86 44 L96 28 L106 44 L116 32 L122 48 L122 56 L70 56 Z"/>
    <rect x="70" y="56" width="52" height="6" rx="2"/>
  </g>
  <circle cx="96" cy="50" r="2.5" fill="#ff2d55"/>
  <circle cx="78" cy="52" r="1.8" fill="#00b0ff"/>
  <circle cx="114" cy="52" r="1.8" fill="#00b0ff"/>

  <!-- Big D Letter -->
  <text x="96" y="138" font-family="Georgia, serif" font-size="92" font-weight="bold" fill="url(#gold)" text-anchor="middle" stroke="#8a6d00" stroke-width="1">D</text>

  <!-- Film Reel Left -->
  <g>
    <circle cx="52" cy="118" r="22" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle cx="52" cy="118" r="4" fill="url(#gold)"/>
    <circle cx="52" cy="105" r="4" fill="url(#gold)"/>
    <circle cx="63" cy="124" r="4" fill="url(#gold)"/>
    <circle cx="41" cy="124" r="4" fill="url(#gold)"/>
  </g>

  <!-- Camera Right -->
  <g fill="url(#gold)" stroke="#8a6d00" stroke-width="0.5">
    <rect x="118" y="108" width="30" height="22" rx="3"/>
    <rect x="148" y="112" width="10" height="14" rx="1"/>
    <circle cx="133" cy="119" r="7" fill="#0f0f1a" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="133" cy="119" r="3" fill="#ff2d55"/>
    <rect x="124" y="103" width="8" height="5" rx="1"/>
  </g>

  <!-- Film Strip Bottom -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.9">
    <path d="M32 150 Q96 165 160 150"/>
  </g>

  <!-- Text -->
  <text x="96" y="178" font-family="Arial, sans-serif" font-size="9" font-weight="bold" letter-spacing="1.5" fill="#ffd700" text-anchor="middle">DIGITAL FILM MAKING STUDIO</text>
</svg>